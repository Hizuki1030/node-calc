<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日本語入力の比較</title>
    <style>
      body {
        margin: 0;
        padding: 20px 20px 60px;
        background: #10151c;
        color: #dbe6f2;
        font-family: 'Hiragino Sans', system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.7;
      }
      h1 { font-size: 17px; margin: 0 0 4px; }
      p.lead { color: #8fa3ba; margin: 0 0 8px; }
      section { margin-bottom: 20px; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      small { display: block; color: #8fa3ba; font-weight: 400; }
      textarea {
        width: 100%;
        box-sizing: border-box;
        height: 80px;
        padding: 10px;
        border: 1px solid #2a3644;
        border-radius: 8px;
        background: #171e27;
        color: #dbe6f2;
        font-family: inherit;
      }
      /* ここが検証の中心。iOS は 16px 未満の入力欄にフォーカスすると自動でズームする */
      .small textarea { font-size: 13px; }
      .big textarea { font-size: 16px; }

      #zoom {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 16px;
        background: #1d2a3a;
        border-top: 1px solid #2a3644;
        font-size: 14px;
        font-weight: 600;
      }
      #zoom b { color: #4cc9a7; }
      #zoom b.on { color: #f0a35e; }
    </style>
  </head>
  <body>
    <h1>A と B を打ち比べてください</h1>
    <p class="lead">
      同じ日本語（例：「けいさんぶろっく」→変換→確定）を打って、重さの差を見てください。<br />
      画面下の表示が、タップした時にページが自動で拡大されたかを示します。
    </p>

    <section class="small">
      <label>A：文字サイズ 13px（今のアプリと同じ）
        <small>iOS ではフォーカス時に自動ズームが起きる条件</small>
      </label>
      <textarea placeholder="ここに日本語を入力"></textarea>
    </section>

    <section class="big">
      <label>B：文字サイズ 16px（それ以外は A と同じ）
        <small>自動ズームが起きない条件</small>
      </label>
      <textarea placeholder="ここに日本語を入力"></textarea>
    </section>

    <section class="small">
      <label>C：13px ＋ 入力補助をすべてオフ
        <small>autocorrect / autocapitalize / spellcheck をオフ</small>
      </label>
      <textarea placeholder="ここに日本語を入力" autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
    </section>

    <section class="big">
      <label>D：16px ＋ 入力補助をすべてオフ
        <small>両方を対策した状態</small>
      </label>
      <textarea placeholder="ここに日本語を入力" autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
    </section>

    <div id="zoom">拡大率： <b id="scale">1.00</b> <span id="note"></span></div>

    <script>
      // 自動ズームが起きているかを目で見なくても分かるようにする
      const scaleEl = document.getElementById('scale')
      const noteEl = document.getElementById('note')
      const viewport = window.visualViewport
      function show() {
        const scale = viewport ? viewport.scale : 1
        scaleEl.textContent = scale.toFixed(2)
        const zoomed = scale > 1.01
        scaleEl.className = zoomed ? 'on' : ''
        noteEl.textContent = zoomed ? '← 自動ズームが起きています' : ''
      }
      viewport?.addEventListener('resize', show)
      viewport?.addEventListener('scroll', show)
      for (const area of document.querySelectorAll('textarea')) {
        area.addEventListener('focus', () => setTimeout(show, 350))
      }
      show()
    </script>
  </body>
</html>
